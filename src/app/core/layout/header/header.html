<header class="sticky top-0 z-10 border-b border-vault-border bg-vault-bg/80 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4">
    <a routerLink="/" class="flex items-center gap-2 font-extrabold tracking-widest">
      <app-logo [size]="32" />
      <span>GAME <span class="text-vault-primary-hover">VAULT</span></span>
    </a>

    <nav class="flex items-center gap-2 text-sm">
      <a
        routerLink="/"
        routerLinkActive="text-vault-text"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-md px-3 py-2 text-vault-muted transition hover:text-vault-text"
      >
        {{ 'nav.home' | translate }}
      </a>

      <button
        type="button"
        (click)="language.toggle()"
        class="rounded-md border border-vault-border px-2 py-1 text-xs font-semibold text-vault-muted transition hover:border-vault-primary hover:text-vault-text"
        [attr.aria-label]="'nav.switchLanguage' | translate"
      >
        {{ language.current() === 'pt' ? 'EN' : 'PT' }}
      </button>

      <a
        routerLink="/login"
        class="rounded-md bg-vault-primary px-4 py-2 font-semibold transition hover:bg-vault-primary-hover"
      >
        {{ 'nav.login' | translate }}
      </a>
    </nav>
  </div>
</header>
